<!DOCTYPE html>
<html lang="ko"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숲 속을 걷다</title>
    <!-- 외부 라이브러리 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif KR', serif; 
            margin: 0; padding: 0; 
            background-color: #ffffff; 
            overflow: hidden; 
        }
        .cursor-blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        /* 입력창 위치를 화면 밖으로 숨김 */
        #hidden-input {
            position: fixed;
            top: -100px;
            opacity: 0;
        }
        /* 커스텀 슬라이더 스타일 */
        input[type='range'] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            outline: none;
        }
        input[type='range']::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #065f46;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isStarted, setIsStarted] = useState(false);
            const [lines, setLines] = useState([]);
            const [currentText, setCurrentText] = useState("");
            const [goal, setGoal] = useState(500);
            const [copyStatus, setCopyStatus] = useState("전체 복사");
            
            // UI 설정 상태
            const [fontSize, setFontSize] = useState(24);
            const [maxWidth, setMaxWidth] = useState(600);
            
            const containerRef = useRef(null);
            const inputRef = useRef(null);

            const getFullText = () => [...lines, currentText].join('\n');

            // 클립보드 복사 기능 (노션 임베드 대응)
            const copyToClipboard = () => {
                const text = getFullText();
                if (!text.trim()) return;

                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyStatus("복사됨!");
                    setTimeout(() => setCopyStatus("전체 복사"), 2000);
                } catch (err) {
                    setCopyStatus("복사 실패");
                }
                document.body.removeChild(textArea);
            };

            // 텍스트 파일(.txt)로 다운로드 기능
            const downloadAsFile = () => {
                const fullText = getFullText();
                if (!fullText.trim()) return;

                const blob = new Blob([fullText], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                const now = new Date();
                const timestamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                
                a.href = url;
                a.download = `숲속산책_${timestamp}.txt`;
                a.click();
                window.URL.revokeObjectURL(url);
            };

            // 화면 어디든 클릭하면 입력창에 포커스
            const handleGlobalClick = () => {
                if (isStarted && inputRef.current) {
                    inputRef.current.focus();
                }
            };

            // 자동 스크롤 로직
            useEffect(() => {
                if (isStarted && containerRef.current) {
                    const activeLine = document.getElementById('active-line');
                    if (activeLine) {
                        const offset = activeLine.offsetTop;
                        const mid = window.innerHeight / 2;
                        containerRef.current.style.transform = `translateY(${mid - offset}px)`;
                    }
                }
            }, [currentText, lines, isStarted]);

            const handleKeyDown = (e) => {
                if (e.nativeEvent.isComposing) return;
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (currentText.trim() === "") return;
                    setLines(prev => [...prev, currentText]);
                    setCurrentText("");
                }
            };

            const totalChars = lines.join('').length + currentText.length;
            const isGoalReached = totalChars >= goal;

            // 시작 화면
            if (!isStarted) {
                return (
                    <div className="flex h-screen items-center justify-center bg-stone-50">
                        <div className="text-center space-y-8 p-10">
                            <h1 className="text-4xl font-extralight text-stone-800 tracking-widest">숲 속을 걷다</h1>
                            <p className="text-stone-400 text-sm italic">"모든 문장은 당신이 남긴 발자국입니다."</p>
                            
                            <div className="pt-10 space-y-4 max-w-xs mx-auto">
                                <div className="text-left">
                                    <label className="text-[10px] text-stone-400 uppercase tracking-widest ml-2 font-bold">목표 글자 수</label>
                                    <input 
                                        type="number" 
                                        value={goal}
                                        onChange={(e) => setGoal(Number(e.target.value))}
                                        className="block w-full text-center bg-transparent border-b border-stone-200 py-2 focus:outline-none focus:border-stone-500 transition-colors"
                                    />
                                </div>
                                <button 
                                    onClick={() => setIsStarted(true)}
                                    className="w-full bg-stone-800 text-white py-4 rounded-sm hover:bg-black transition-all font-light tracking-widest"
                                >
                                    산책 시작
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative h-screen w-screen overflow-hidden bg-white" onClick={handleGlobalClick}>
                    {/* 설정 패널 */}
                    <div className="fixed top-8 left-8 z-50 flex flex-col gap-4 p-4 bg-white/50 backdrop-blur-md rounded-xl border border-stone-100 opacity-20 hover:opacity-100 transition-opacity duration-500">
                        <div className="space-y-1">
                            <label className="text-[9px] text-stone-500 uppercase tracking-tighter block font-bold">글자 크기</label>
                            <input type="range" min="14" max="60" value={fontSize} onChange={(e) => setFontSize(e.target.value)} className="w-24" />
                        </div>
                        <div className="space-y-1">
                            <label className="text-[9px] text-stone-500 uppercase tracking-tighter block font-bold">문단 너비</label>
                            <input type="range" min="300" max="1200" value={maxWidth} onChange={(e) => setMaxWidth(e.target.value)} className="w-24" />
                        </div>
                    </div>

                    <textarea id="hidden-input" ref={inputRef} autoFocus value={currentText} onChange={(e) => setCurrentText(e.target.value)} onKeyDown={handleKeyDown} />

                    <div ref={containerRef} className="absolute w-full transition-transform duration-700 ease-out flex flex-col items-center">
                        <div className="space-y-16 transition-all duration-300" style={{ width: '90%', maxWidth: `${maxWidth}px` }}>
                            {lines.map((line, i) => (
                                <p key={i} className="text-stone-300 text-center leading-loose break-words" style={{ fontSize: `${fontSize}px` }}>{line}</p>
                            ))}
                            <div id="active-line" className="text-center relative">
                                <span className="text-stone-800 leading-loose break-words inline-block min-h-[1.5em]" style={{ fontSize: `${fontSize}px` }}>{currentText}</span>
                                <span className="inline-block w-[1.5px] bg-emerald-600 ml-1 align-middle cursor-blink" style={{ height: `${fontSize * 1.2}px` }} />
                            </div>
                            <div className="h-[60vh]" />
                        </div>
                    </div>

                    {/* 하단 제어 바: 목표 달성 시 저장 및 복사 버튼 노출 */}
                    <div className={`fixed bottom-8 left-0 w-full flex justify-center pointer-events-none transition-all duration-1000 ${isGoalReached ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                        <div className="bg-white/90 backdrop-blur-md px-6 py-3 rounded-full border border-stone-200 shadow-xl flex items-center gap-6 pointer-events-auto">
                            <div className="flex flex-col items-center pr-4 border-r border-stone-100">
                                <span className="text-[10px] text-stone-400 font-bold uppercase tracking-tighter">글자 수</span>
                                <span className="text-sm text-emerald-600 font-bold tabular-nums">{totalChars} / {goal}</span>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={copyToClipboard} className="text-[10px] bg-stone-100 text-stone-600 px-4 py-2 rounded-full hover:bg-stone-200 transition-colors uppercase font-bold tracking-widest min-w-[90px]">
                                    {copyStatus}
                                </button>
                                <button onClick={downloadAsFile} className="text-[10px] bg-stone-800 text-white px-4 py-2 rounded-full hover:bg-black transition-colors uppercase font-bold tracking-widest">
                                    텍스트 저장 (.txt)
                                </button>
                                <button onClick={() => confirm("산책을 종료할까요? (저장되지 않은 글은 사라집니다)") && setIsStarted(false)} className="text-[10px] text-stone-400 hover:text-stone-800 transition-colors uppercase font-bold tracking-widest px-2">
                                    종료
                                </button>
                            </div>
                        </div>
                    </div>

                    {!isGoalReached && (
                        <div className="fixed bottom-8 right-8 text-[10px] text-stone-300 font-bold uppercase tracking-[0.2em]">
                            {totalChars} / {goal}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
