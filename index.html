<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숲 속을 걷다</title>
    <!-- 외부 라이브러리: 최소한의 핵심 도구만 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif KR', serif; 
            margin: 0; padding: 0; 
            background-color: #ffffff; 
            overflow: hidden; 
        }
        .cursor-blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        /* 입력창 숨기기 */
        #hidden-input {
            position: fixed;
            top: -100px;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isStarted, setIsStarted] = useState(false);
            const [lines, setLines] = useState([]);
            const [currentText, setCurrentText] = useState("");
            const [goal, setGoal] = useState(500);
            
            const containerRef = useRef(null);
            const inputRef = useRef(null);

            // 화면 클릭 시 입력창으로 포커스 강제 이동
            const handleGlobalClick = () => {
                if (isStarted && inputRef.current) {
                    inputRef.current.focus();
                }
            };

            // 자동 스크롤 로직 (현재 쓰는 줄을 항상 가운데로)
            useEffect(() => {
                if (isStarted && containerRef.current) {
                    const activeLine = document.getElementById('active-line');
                    if (activeLine) {
                        const offset = activeLine.offsetTop;
                        const mid = window.innerHeight / 2;
                        containerRef.current.style.transform = `translateY(${mid - offset}px)`;
                    }
                }
            }, [currentText, lines, isStarted]);

            const handleKeyDown = (e) => {
                // 한글 씹힘 방지 (IME 체크)
                if (e.nativeEvent.isComposing) return;

                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (currentText.trim() === "") return;
                    setLines(prev => [...prev, currentText]);
                    setCurrentText("");
                }
            };

            const totalChars = lines.join('').length + currentText.length;

            // 시작 화면
            if (!isStarted) {
                return (
                    <div className="flex h-screen items-center justify-center bg-stone-50">
                        <div className="text-center space-y-8 p-10">
                            <h1 className="text-4xl font-extralight text-stone-800 tracking-widest">숲 속을 걷다</h1>
                            <p className="text-stone-400 text-sm italic">"모든 문장은 당신이 남긴 발자국입니다."</p>
                            <div className="pt-10 space-y-4">
                                <input 
                                    type="number" 
                                    value={goal}
                                    onChange={(e) => setGoal(e.target.value)}
                                    className="block w-full text-center bg-transparent border-b border-stone-200 py-2 focus:outline-none focus:border-stone-500 transition-colors"
                                    placeholder="목표 글자 수"
                                />
                                <button 
                                    onClick={() => setIsStarted(true)}
                                    className="w-full bg-stone-800 text-white py-4 rounded-sm hover:bg-black transition-all font-light tracking-widest"
                                >
                                    산책 시작
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // 집필 화면
            return (
                <div className="relative h-screen w-screen overflow-hidden bg-white" onClick={handleGlobalClick}>
                    {/* 실제 입력을 받는 숨겨진 요소 */}
                    <textarea
                        id="hidden-input"
                        ref={inputRef}
                        autoFocus
                        value={currentText}
                        onChange={(e) => setCurrentText(e.target.value)}
                        onKeyDown={handleKeyDown}
                    />

                    {/* 텍스트 렌더링 영역 */}
                    <div 
                        ref={containerRef} 
                        className="absolute w-full transition-transform duration-700 ease-out flex flex-col items-center"
                    >
                        <div className="w-[80%] max-w-2xl space-y-16">
                            {lines.map((line, i) => (
                                <p key={i} className="text-stone-300 text-center leading-loose text-xl break-words">
                                    {line}
                                </p>
                            ))}
                            <div id="active-line" className="text-center relative">
                                <span className="text-stone-800 text-2xl leading-loose break-words inline-block min-h-[1.5em]">
                                    {currentText}
                                </span>
                                <span className="inline-block w-[1.5px] h-[1.2em] bg-emerald-600 ml-1 align-middle cursor-blink" />
                            </div>
                            <div className="h-[60vh]" />
                        </div>
                    </div>

                    {/* 상태 바 */}
                    <div className="fixed bottom-8 left-0 w-full flex justify-center pointer-events-none">
                        <div className="bg-white/80 backdrop-blur-sm px-6 py-2 rounded-full border border-stone-100 shadow-sm flex items-center gap-8">
                            <div className="flex flex-col items-center">
                                <span className="text-[10px] text-stone-400 font-bold uppercase tracking-tighter">Progress</span>
                                <span className="text-sm text-stone-800 font-medium tabular-nums">
                                    {totalChars} / {goal}
                                </span>
                            </div>
                            <button 
                                onClick={() => setIsStarted(false)}
                                className="pointer-events-auto text-[10px] text-stone-300 hover:text-stone-800 transition-colors uppercase font-bold tracking-widest"
                            >
                                Stop
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
