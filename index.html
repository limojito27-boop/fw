<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숲 속을 걷다 - Forest Walk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&display=swap');
        body { 
            font-family: 'Noto Serif KR', serif; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
        }
        .cursor-blink {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        /* 숨겨진 스크롤바 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [lines, setLines] = useState([]);
            const [currentText, setCurrentText] = useState("");
            const [goal, setGoal] = useState(500);
            const [fontSize, setFontSize] = useState(1.1);
            const [textAlign, setTextAlign] = useState("left"); // 기본 좌측 정렬
            const [maxWidth, setMaxWidth] = useState(42); // 가로 너비 (rem)
            const [isStarted, setIsStarted] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            const inputRef = useRef(null);
            const containerRef = useRef(null);
            const currentLineRef = useRef(null);

            // 초기 설정 로드
            useEffect(() => {
                const savedData = localStorage.getItem('forest-walk-v2');
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    setLines(parsed.lines || []);
                    setGoal(parsed.goal || 500);
                    setFontSize(parsed.fontSize || 1.1);
                    setTextAlign(parsed.textAlign || "left");
                    setMaxWidth(parsed.maxWidth || 42);
                }
            }, []);

            // 자동 저장
            useEffect(() => {
                const state = { lines, goal, fontSize, textAlign, maxWidth };
                localStorage.setItem('forest-walk-v2', JSON.stringify(state));
            }, [lines, goal, fontSize, textAlign, maxWidth]);

            // 스크롤 동기화
            useEffect(() => {
                if (isStarted && currentLineRef.current && containerRef.current) {
                    const lineOffset = currentLineRef.current.offsetTop;
                    const viewportMid = window.innerHeight / 2;
                    containerRef.current.style.transform = `translateY(${viewportMid - lineOffset}px)`;
                }
            }, [currentText, lines, isStarted, fontSize, maxWidth]);

            const handleStart = () => {
                setIsStarted(true);
                setTimeout(() => inputRef.current?.focus(), 100);
            };

            const handleKeyDown = (e) => {
                if (e.nativeEvent.isComposing) return;
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (currentText.trim() !== "") {
                        setLines(prev => [...prev, currentText]);
                        setCurrentText("");
                    }
                }
            };

            const totalChars = lines.join('').length + currentText.length;

            if (!isStarted) {
                return (
                    <div className="flex h-screen flex-col items-center justify-center p-8 bg-white">
                        <div className="max-w-md w-full text-center space-y-12">
                            <h1 className="text-5xl font-extralight text-emerald-900 tracking-[0.2em]">숲 속을 걷다</h1>
                            <p className="text-gray-400 text-sm italic">"모든 글자는 당신의 발자국입니다."</p>
                            
                            <div className="space-y-4 pt-10">
                                <div className="text-left">
                                    <label className="text-[10px] uppercase tracking-widest text-gray-400 ml-2">목표 글자수</label>
                                    <input 
                                        type="number" 
                                        value={goal} 
                                        onChange={(e) => setGoal(Number(e.target.value))}
                                        className="w-full bg-gray-50 border-none rounded-2xl p-4 text-center text-xl focus:ring-2 focus:ring-emerald-100 outline-none transition-all"
                                    />
                                </div>
                                <button onClick={handleStart} className="w-full bg-emerald-900 text-white rounded-2xl py-5 text-lg font-light hover:bg-emerald-800 transition-all shadow-xl shadow-emerald-100">
                                    {lines.length > 0 ? "여정 이어가기" : "새 여정 시작"}
                                </button>
                                {lines.length > 0 && (
                                    <button onClick={() => {if(confirm('여정을 초기화할까요?')) setLines([]);}} className="w-full text-gray-300 text-xs hover:text-red-300 transition-colors">기록 삭제</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative h-screen w-screen bg-white overflow-hidden" onClick={() => inputRef.current?.focus()}>
                    
                    {/* 설정 메뉴 패널 */}
                    <div className="fixed top-6 left-6 z-[100] flex flex-col gap-4">
                        <button 
                            onClick={(e) => { e.stopPropagation(); setShowSettings(!showSettings); }}
                            className="w-10 h-10 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:text-emerald-800 transition-all pointer-events-auto shadow-sm"
                        >
                            {showSettings ? '✕' : '☰'}
                        </button>

                        {showSettings && (
                            <div className="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl border border-gray-100 w-64 space-y-6 pointer-events-auto animate-in fade-in slide-in-from-left-4 duration-300" onClick={e => e.stopPropagation()}>
                                <div className="space-y-2">
                                    <label className="text-[10px] uppercase tracking-widest text-emerald-800 font-bold">글자 크기 ({fontSize}rem)</label>
                                    <input type="range" min="0.8" max="2.5" step="0.1" value={fontSize} onChange={e => setFontSize(e.target.value)} className="w-full accent-emerald-600" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] uppercase tracking-widest text-emerald-800 font-bold">좌우 여백 (폭 조절)</label>
                                    <input type="range" min="20" max="60" step="1" value={maxWidth} onChange={e => setMaxWidth(e.target.value)} className="w-full accent-emerald-600" />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] uppercase tracking-widest text-emerald-800 font-bold">정렬 방향</label>
                                    <div className="flex bg-gray-100 p-1 rounded-xl">
                                        <button onClick={() => setTextAlign('left')} className={`flex-1 py-2 text-xs rounded-lg transition-all ${textAlign === 'left' ? 'bg-white shadow-sm text-emerald-800' : 'text-gray-400'}`}>좌측</button>
                                        <button onClick={() => setTextAlign('center')} className={`flex-1 py-2 text-xs rounded-lg transition-all ${textAlign === 'center' ? 'bg-white shadow-sm text-emerald-800' : 'text-gray-400'}`}>중앙</button>
                                    </div>
                                </div>
                                <button onClick={() => setIsStarted(false)} className="w-full py-3 bg-gray-900 text-white rounded-xl text-xs font-light tracking-widest">메인으로</button>
                            </div>
                        )}
                    </div>

                    {/* 본문 영역 */}
                    <div 
                        ref={containerRef}
                        className="mx-auto px-10 transition-all duration-700 ease-out"
                        style={{ maxWidth: `${maxWidth}rem` }}
                    >
                        <div className="space-y-4 mb-4">
                            {lines.map((line, i) => (
                                <p key={i} className="text-gray-300 leading-relaxed break-words" style={{ fontSize: `${fontSize}rem`, textAlign: textAlign }}>
                                    {line}
                                </p>
                            ))}
                        </div>

                        <div ref={currentLineRef} style={{ fontSize: `${fontSize}rem`, textAlign: textAlign }} className="relative">
                            <span className="text-emerald-900 leading-relaxed break-words min-h-[1.5em] inline-block">
                                {currentText}
                                <span className="inline-block w-[2px] h-[1.1em] bg-emerald-500 ml-1 align-middle cursor-blink" />
                            </span>
                        </div>
                        <div className="h-[60vh]" />
                    </div>

                    <textarea
                        ref={inputRef}
                        value={currentText}
                        onChange={(e) => setCurrentText(e.target.value)}
                        onKeyDown={handleKeyDown}
                        className="fixed opacity-0 pointer-events-none"
                    />

                    {/* 진행도 표시 */}
                    <div className="fixed bottom-10 right-10 text-right select-none pointer-events-none">
                        <div className="text-4xl font-light text-emerald-900/10 tracking-tighter tabular-nums leading-none">
                            {totalChars}
                        </div>
                        <div className="text-[10px] uppercase tracking-widest text-emerald-900/20 mt-1">
                            PROGRESS / {goal}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
