<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숲 속을 걷다</title>
    <!-- 외부 라이브러리 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Serif KR', serif; 
            margin: 0; padding: 0; 
            background-color: #ffffff; 
            overflow: hidden; 
        }
        .cursor-blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #hidden-input {
            position: fixed;
            top: -100px;
            opacity: 0;
        }
        input[type='range'] {
            -webkit-appearance: none;
            width: 100%;
            height: 2px;
            background: #e5e7eb;
            outline: none;
        }
        input[type='range']::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #065f46;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isStarted, setIsStarted] = useState(false);
            const [lines, setLines] = useState([]);
            const [currentText, setCurrentText] = useState("");
            const [goal, setGoal] = useState(500);
            
            // 환경 설정 상태
            const [fontSize, setFontSize] = useState(24);
            const [maxWidth, setMaxWidth] = useState(600);
            
            const containerRef = useRef(null);
            const inputRef = useRef(null);

            // 텍스트 파일로 다운로드하는 기능
            const downloadAsFile = () => {
                const fullText = [...lines, currentText].join('\n');
                if (!fullText.trim()) return;

                const blob = new Blob([fullText], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                
                const now = new Date();
                const timestamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
                
                a.href = url;
                a.download = `숲속을걷다_${timestamp}.txt`;
                a.click();
                window.URL.revokeObjectURL(url);
            };

            const handleGlobalClick = () => {
                if (isStarted && inputRef.current) {
                    inputRef.current.focus();
                }
            };

            useEffect(() => {
                if (isStarted && containerRef.current) {
                    const activeLine = document.getElementById('active-line');
                    if (activeLine) {
                        const offset = activeLine.offsetTop;
                        const mid = window.innerHeight / 2;
                        containerRef.current.style.transform = `translateY(${mid - offset}px)`;
                    }
                }
            }, [currentText, lines, isStarted]);

            const handleKeyDown = (e) => {
                if (e.nativeEvent.isComposing) return;
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (currentText.trim() === "") return;
                    setLines(prev => [...prev, currentText]);
                    setCurrentText("");
                }
            };

            const totalChars = lines.join('').length + currentText.length;

            if (!isStarted) {
                return (
                    <div className="flex h-screen items-center justify-center bg-stone-50">
                        <div className="text-center space-y-8 p-10">
                            <h1 className="text-4xl font-extralight text-stone-800 tracking-widest">숲 속을 걷다</h1>
                            <p className="text-stone-400 text-sm italic">"모든 문장은 당신이 남긴 발자국입니다."</p>
                            
                            <div className="pt-10 space-y-4 max-w-xs mx-auto">
                                <div className="text-left">
                                    <label className="text-[10px] text-stone-400 uppercase tracking-widest ml-2">목표 글자 수</label>
                                    <input 
                                        type="number" 
                                        value={goal}
                                        onChange={(e) => setGoal(e.target.value)}
                                        className="block w-full text-center bg-transparent border-b border-stone-200 py-2 focus:outline-none focus:border-stone-500 transition-colors"
                                    />
                                </div>
                                <button 
                                    onClick={() => setIsStarted(true)}
                                    className="w-full bg-stone-800 text-white py-4 rounded-sm hover:bg-black transition-all font-light tracking-widest"
                                >
                                    산책 시작
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative h-screen w-screen overflow-hidden bg-white" onClick={handleGlobalClick}>
                    {/* 설정 패널 */}
                    <div className="fixed top-8 left-8 z-50 flex flex-col gap-4 p-4 bg-white/50 backdrop-blur-md rounded-xl border border-stone-100 opacity-20 hover:opacity-100 transition-opacity duration-500">
                        <div className="space-y-1">
                            <label className="text-[9px] text-stone-500 uppercase tracking-tighter block font-bold">Text Size</label>
                            <input 
                                type="range" min="14" max="60" value={fontSize}
                                onChange={(e) => setFontSize(e.target.value)}
                                className="w-24"
                            />
                        </div>
                        <div className="space-y-1">
                            <label className="text-[9px] text-stone-500 uppercase tracking-tighter block font-bold">Line Width</label>
                            <input 
                                type="range" min="300" max="1200" value={maxWidth}
                                onChange={(e) => setMaxWidth(e.target.value)}
                                className="w-24"
                            />
                        </div>
                    </div>

                    <textarea
                        id="hidden-input"
                        ref={inputRef}
                        autoFocus
                        value={currentText}
                        onChange={(e) => setCurrentText(e.target.value)}
                        onKeyDown={handleKeyDown}
                    />

                    <div 
                        ref={containerRef} 
                        className="absolute w-full transition-transform duration-700 ease-out flex flex-col items-center"
                    >
                        <div className="space-y-16 transition-all duration-300" style={{ width: '90%', maxWidth: `${maxWidth}px` }}>
                            {lines.map((line, i) => (
                                <p key={i} className="text-stone-300 text-center leading-loose break-words transition-all duration-300" style={{ fontSize: `${fontSize}px` }}>
                                    {line}
                                </p>
                            ))}
                            <div id="active-line" className="text-center relative">
                                <span className="text-stone-800 leading-loose break-words inline-block min-h-[1.5em] transition-all duration-300" style={{ fontSize: `${fontSize}px` }}>
                                    {currentText}
                                </span>
                                <span className="inline-block w-[1.5px] bg-emerald-600 ml-1 align-middle cursor-blink" style={{ height: `${fontSize * 1.2}px` }} />
                            </div>
                            <div className="h-[60vh]" />
                        </div>
                    </div>

                    {/* 상태 바 및 하단 제어 */}
                    <div className="fixed bottom-8 left-0 w-full flex justify-center pointer-events-none">
                        <div className="bg-white/80 backdrop-blur-sm px-6 py-2 rounded-full border border-stone-100 shadow-sm flex items-center gap-8">
                            <div className="flex flex-col items-center">
                                <span className="text-[10px] text-stone-400 font-bold uppercase tracking-tighter">Progress</span>
                                <span className="text-sm text-stone-800 font-medium tabular-nums">
                                    {totalChars} / {goal}
                                </span>
                            </div>
                            <div className="flex gap-4 pointer-events-auto">
                                <button 
                                    onClick={downloadAsFile}
                                    className="text-[10px] bg-stone-800 text-white px-4 py-1.5 rounded-full hover:bg-black transition-colors uppercase font-bold tracking-widest"
                                >
                                    Save (.txt)
                                </button>
                                <button 
                                    onClick={() => setIsStarted(false)}
                                    className="text-[10px] text-stone-400 hover:text-stone-800 transition-colors uppercase font-bold tracking-widest px-2"
                                >
                                    Exit
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
