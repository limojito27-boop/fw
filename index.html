<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숲 속을 걷다 - 단일 파일 실행 버전</title>
    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. React 18 & Babel (브라우저 내 컴파일용) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 3. Firebase SDK (Compat 모드 - 브라우저 직접 로드용) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;400;700&display=swap');
        body { 
            font-family: 'Noto Serif KR', serif; 
            overflow: hidden; 
            margin: 0; 
            background-color: white; 
            height: 100vh;
        }
        .cursor-blink { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #root { height: 100%; width: 100%; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- type="text/babel"은 Babel이 브라우저에서 이 스크립트를 찾아 JS로 변환하게 합니다. -->
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Firebase 설정 (환경 변수가 없을 경우 데모용 더미 설정 사용)
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {
            apiKey: "", 
            authDomain: "", 
            projectId: "forest-walk-demo", 
            storageBucket: "", 
            messagingSenderId: "", 
            appId: ""
        };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'forest-walk-default';

        // Firebase 초기화
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const App = () => {
            const [user, setUser] = useState(null);
            const [lines, setLines] = useState([]);
            const [currentText, setCurrentText] = useState("");
            const [goal, setGoal] = useState(500);
            const [fontSize, setFontSize] = useState(1.1);
            const [isStarted, setIsStarted] = useState(false);
            const [isLoading, setIsLoading] = useState(true);
            
            const inputRef = useRef(null);
            const containerRef = useRef(null);
            const currentLineRef = useRef(null);
            const debounceTimer = useRef(null);

            // 인증 처리 (Canvas 환경 및 로컬 환경 호환)
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (e) {
                        console.error("Auth error:", e);
                    } finally {
                        setIsLoading(false);
                    }
                };

                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) setUser(u);
                });
                return () => unsubscribe();
            }, []);

            // 데이터 동기화 (Firestore)
            useEffect(() => {
                if (!user) return;
                const docPath = `artifacts/${appId}/users/${user.uid}/writingData/currentSession`;
                const unsubscribe = db.doc(docPath).onSnapshot((docSnap) => {
                    if (docSnap.exists) {
                        const data = docSnap.data();
                        setLines(data.lines || []);
                        setGoal(data.goal || 500);
                        setFontSize(data.fontSize || 1.1);
                        // 입력 중인 텍스트는 포커스가 없을 때만 갱신 (사용자 입력 방해 금지)
                        if (document.activeElement !== inputRef.current) {
                            setCurrentText(data.currentText || "");
                        }
                    }
                }, (error) => {
                    console.warn("Database connection notice: Run in standard environment for cloud saving.");
                });
                return () => unsubscribe();
            }, [user]);

            const syncToCloud = useCallback((updatedLines, updatedText, updatedGoal, updatedFontSize) => {
                if (!user) return;
                if (debounceTimer.current) clearTimeout(debounceTimer.current);
                debounceTimer.current = setTimeout(() => {
                    const docPath = `artifacts/${appId}/users/${user.uid}/writingData/currentSession`;
                    db.doc(docPath).set({
                        lines: updatedLines,
                        currentText: updatedText,
                        goal: updatedGoal,
                        fontSize: updatedFontSize,
                        lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(err => {});
                }, 1000);
            }, [user]);

            // 타자기 스크롤 애니메이션
            useEffect(() => {
                if (isStarted && currentLineRef.current && containerRef.current) {
                    const lineOffset = currentLineRef.current.offsetTop;
                    const viewportMid = window.innerHeight / 2;
                    containerRef.current.style.transform = `translateY(${viewportMid - lineOffset}px)`;
                }
            }, [currentText, lines, isStarted, fontSize]);

            const handleKeyDown = (e) => {
                if (e.nativeEvent.isComposing) return; // 한글 조합 에러 방지
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const newLines = [...lines, currentText];
                    setLines(newLines);
                    setCurrentText("");
                    syncToCloud(newLines, "", goal, fontSize);
                }
            };

            const totalChars = lines.join('').length + currentText.length;

            if (isLoading) {
                return (
                    <div className="flex h-screen w-screen items-center justify-center bg-white">
                        <div className="flex flex-col items-center gap-4">
                            <div className="w-8 h-8 border-2 border-emerald-100 border-t-emerald-600 rounded-full animate-spin" />
                            <p className="text-sm tracking-widest text-emerald-800/40 italic">숲으로 가는 길을 찾는 중...</p>
                        </div>
                    </div>
                );
            }

            if (!isStarted) {
                return (
                    <div className="flex h-screen w-screen flex-col items-center justify-center bg-white p-6">
                        <div className="max-w-xs w-full text-center space-y-10">
                            <h1 className="text-4xl font-light text-emerald-900 tracking-widest">숲 속을 걷다</h1>
                            <p className="text-gray-400 text-sm italic leading-relaxed">"모든 글자는 당신이 남긴<br/>숲의 발자국입니다."</p>
                            <div className="space-y-4 pt-6 text-left">
                                <div className="space-y-1">
                                    <label className="text-[10px] text-gray-400 ml-1 uppercase tracking-widest font-bold">목표 글자수</label>
                                    <input 
                                        type="number" value={goal}
                                        onChange={(e) => setGoal(Number(e.target.value))}
                                        className="w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 text-center text-lg focus:ring-2 focus:ring-emerald-100 outline-none transition-all"
                                    />
                                </div>
                                <button 
                                    onClick={() => {
                                        setIsStarted(true);
                                        setTimeout(() => inputRef.current?.focus(), 100);
                                    }}
                                    className="w-full bg-emerald-800 text-white rounded-2xl p-4 font-bold shadow-xl shadow-emerald-100 hover:bg-emerald-900 transition-all active:scale-95"
                                >
                                    산책 시작하기
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="relative h-screen w-screen bg-white overflow-hidden" onClick={() => inputRef.current?.focus()}>
                    <textarea
                        ref={inputRef}
                        value={currentText}
                        onChange={(e) => {
                            setCurrentText(e.target.value);
                            syncToCloud(lines, e.target.value, goal, fontSize);
                        }}
                        onKeyDown={handleKeyDown}
                        className="absolute inset-0 opacity-0 z-50 cursor-default resize-none outline-none"
                        spellCheck="false"
                        autoFocus
                    />
                    
                    {/* 상단 옵션 패널 */}
                    <div className="absolute top-8 left-8 z-40 flex items-center gap-6 opacity-20 hover:opacity-100 transition-opacity duration-500 bg-white/80 backdrop-blur-md p-4 px-6 rounded-full border border-gray-100 shadow-sm">
                        <div className="flex flex-col">
                            <span className="text-[9px] text-gray-400 font-bold tracking-widest mb-1 uppercase">Font Size</span>
                            <input 
                                type="range" min="0.8" max="2.0" step="0.1" value={fontSize}
                                onChange={(e) => setFontSize(parseFloat(e.target.value))}
                                className="w-24 accent-emerald-700 cursor-pointer"
                            />
                        </div>
                        <div className="w-px h-4 bg-gray-200"></div>
                        <button 
                            onClick={() => setIsStarted(false)} 
                            className="text-[10px] text-gray-400 hover:text-emerald-700 font-bold tracking-widest uppercase"
                        >
                            Exit
                        </button>
                    </div>

                    {/* 타자기 텍스트 레이어 */}
                    <div ref={containerRef} className="absolute w-full transition-transform duration-1000 ease-out flex flex-col items-center">
                        <div className="w-[85%] max-w-2xl space-y-16">
                            {lines.map((line, i) => (
                                <p key={i} className="text-gray-300 leading-relaxed text-center break-words transition-colors duration-1000" style={{ fontSize: `${fontSize}rem` }}>
                                    {line}
                                </p>
                            ))}
                            <div ref={currentLineRef} className="text-center" style={{ fontSize: `${fontSize}rem` }}>
                                <span className="text-gray-800 leading-relaxed break-words inline-block min-h-[1.5em]">
                                    {currentText}
                                </span>
                                <span className="inline-block w-[2px] h-[1.1em] bg-emerald-600 ml-2 align-middle cursor-blink" />
                            </div>
                            <div className="h-[80vh]" /> 
                        </div>
                    </div>

                    {/* 하단 글자수 카운터 */}
                    <div className="absolute bottom-12 right-12 text-right pointer-events-none select-none">
                        <div className="text-7xl font-extralight text-emerald-900/10 tabular-nums leading-none tracking-tighter">
                            {totalChars}
                        </div>
                        <div className="text-[10px] text-emerald-800/30 uppercase tracking-[0.5em] mt-4 font-bold">
                            Steps / {goal}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
