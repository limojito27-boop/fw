<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOMEN'S COSTUME CLOSET — 여성복 프롬프트 옷장</title>
<style>
  :root{
    --bg:#faf8f5; --card:#ffffff; --ink:#2b2622; --sub:#8a7f74;
    --line:#e8e1d8; --accent:#9a6b4f; --accent2:#5f7161; --chip:#f1ebe3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; overflow-x:hidden;}
  header{padding:20px 14px 10px; text-align:center;}
  header h1{margin:0; font-size:20px; letter-spacing:3px; font-weight:800;}
  header p{margin:6px 0 0; font-size:11px; color:var(--sub); letter-spacing:1px;}
  .toolbar{max-width:980px; margin:12px auto 0; padding:0 12px;}
  .search{display:flex; gap:8px;}
  .search input{flex:1; min-width:0; border:1px solid var(--line); border-radius:999px;
    padding:10px 16px; font-size:14px; background:var(--card); outline:none;}
  .search input:focus{border-color:var(--accent);}
  .seasons{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
  .seasons button{border:1px solid var(--line); background:var(--card); color:var(--sub);
    border-radius:999px; padding:8px 16px; font-size:12px; font-weight:700; cursor:pointer;}
  .seasons button.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .count{max-width:980px; margin:10px auto 0; padding:0 14px; font-size:11px; color:var(--sub);}
  .grid{max-width:980px; margin:8px auto 0; padding:0 10px 10px; display:grid;
    grid-template-columns:repeat(2,1fr); gap:10px;}
  @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .card .meta{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .badge{font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; letter-spacing:1px;}
  .badge.spring{background:#e9f3e4; color:#4c7a3f;}
  .badge.summer{background:#e3f0f5; color:#2f6f8a;}
  .badge.autumn{background:#f5ead9; color:#9a6b2f;}
  .badge.winter{background:#e8e9f2; color:#4f5a8a;}
  .cid{font-size:11px; font-weight:800; color:var(--ink); letter-spacing:1px;}
  .style{font-size:10px; color:var(--sub);}
  .noimg{width:100%; aspect-ratio:4/3; border-radius:10px; background:var(--chip);
    display:flex; align-items:center; justify-content:center; color:#c4b8aa; font-size:11px; letter-spacing:2px;}
  .preview{font-size:11px; line-height:1.55; color:#5c5248; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:3.1em;}
  .btns{display:flex; gap:6px; margin-top:auto;}
  .btns button{flex:1; border:none; border-radius:9px; padding:10px 4px; font-size:11px;
    font-weight:800; cursor:pointer; min-height:38px;}
  .b-rand{background:var(--chip); color:var(--accent);}
  .b-copy{background:var(--ink); color:#fff;}
  .b-det{background:#fff; border:1px solid var(--line) !important; color:var(--sub);}
  .pager{display:flex; justify-content:center; align-items:center; gap:8px; padding:16px 0 40px;}
  .pager button{border:1px solid var(--line); background:var(--card); border-radius:9px;
    padding:9px 14px; font-size:12px; font-weight:800; cursor:pointer; color:var(--ink);}
  .pager button:disabled{opacity:.35;}
  .pager span{font-size:12px; color:var(--sub); font-weight:700;}
  /* detail bottom sheet */
  .sheet-bg{position:fixed; inset:0; background:rgba(40,32,25,.45); z-index:90; display:none;}
  .sheet-bg.open{display:block;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:100; background:var(--card);
    border-radius:18px 18px 0 0; max-height:85vh; display:none; flex-direction:column;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);}
  .sheet.open{display:flex;}
  .sheet-head{display:flex; align-items:center; gap:8px; padding:14px 16px 10px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .sheet-head .x{margin-left:auto; border:none; background:var(--chip); border-radius:999px;
    width:34px; height:34px; font-size:15px; cursor:pointer; color:var(--sub);}
  .sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 16px; flex:1; min-height:0;}
  .piece{display:flex; flex-direction:column; gap:4px; padding:10px 0; border-bottom:1px dashed var(--line);}
  .piece .lab{font-size:11px; font-weight:800; color:var(--sub);}
  .piece .desc{font-size:12px; color:var(--ink); word-break:break-word;}
  .piece select{width:100%; max-width:100%; border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; font-size:13px; background:#fff; color:var(--ink);}
  .fullprompt{margin-top:12px; background:var(--chip); border-radius:10px; padding:12px;
    font-size:12px; line-height:1.6; word-break:break-word; white-space:normal;}
  .sheet-foot{display:flex; gap:8px; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);}
  .sheet-foot button{flex:1; border:none; border-radius:10px; padding:13px; font-size:13px;
    font-weight:800; cursor:pointer; min-height:46px;}
  /* toast + manual copy */
  .toast{position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink);
    color:#fff; font-size:12px; font-weight:700; padding:10px 18px; border-radius:999px;
    z-index:200; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86vw; text-align:center;}
  .toast.show{opacity:1;}
  .manual-bg{position:fixed; inset:0; background:rgba(40,32,25,.5); z-index:210; display:none;
    align-items:center; justify-content:center; padding:20px;}
  .manual-bg.open{display:flex;}
  .manual{background:#fff; border-radius:14px; padding:16px; width:100%; max-width:420px;}
  .manual p{margin:0 0 8px; font-size:12px; color:var(--sub);}
  .manual textarea{width:100%; height:120px; border:1px solid var(--line); border-radius:9px;
    padding:10px; font-size:12px; resize:none;}
  .manual button{margin-top:10px; width:100%; border:none; background:var(--ink); color:#fff;
    border-radius:9px; padding:12px; font-size:13px; font-weight:800; cursor:pointer;}
</style>

<header>
  <h1>WOMEN'S COSTUME CLOSET</h1>
  <p>여성복 완성 코디 프롬프트 옷장 · 색상 자유 변경</p>
</header>

<div class="toolbar">
  <div class="search">
    <input id="searchInput" type="search" placeholder="키워드 또는 ID 검색 (예: linen, SP-03, 오피스)" autocomplete="off">
  </div>
  <div class="seasons" id="seasonTabs"></div>
</div>

<div class="count" id="countText"></div>
<div class="grid" id="grid"></div>

<div class="pager">
  <button id="prevBtn">◀ 이전</button>
  <span id="pageText"></span>
  <button id="nextBtn">다음 ▶</button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <span class="badge" id="shBadge"></span>
    <span class="cid" id="shId"></span>
    <span class="style" id="shStyle"></span>
    <button class="x" id="shClose" aria-label="닫기">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="b-rand" id="shRand">🎲 색상 랜덤</button>
    <button class="b-copy" id="shCopy">📋 프롬프트 복사</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="manual-bg" id="manualBg">
  <div class="manual">
    <p>자동 복사가 차단되었습니다. 아래 내용을 길게 눌러 직접 복사하세요.</p>
    <textarea id="manualText" readonly></textarea>
    <button id="manualClose">닫기</button>
  </div>
</div>

const SEASON_KO = {all:"전체", spring:"봄", summer:"여름", autumn:"가을", winter:"겨울"};
const PER_PAGE = 12;

/* ===== 상태: 코디별 색상 선택은 ID 키로 독립 저장 (데이터 혼합 방지) ===== */
const colorState = {}; // {outfitId: [colorIndex or -1 per piece]}
function initColors(){
  OUTFITS.forEach(o=>{
    colorState[o.id] = o.pieces.map(p=> p.colors.length ? Math.floor(Math.random()*p.colors.length) : -1);
  });
}
function randomizeColors(id){
  const o = OUTFITS.find(x=>x.id===id);
  colorState[id] = o.pieces.map(p=> p.colors.length ? Math.floor(Math.random()*p.colors.length) : -1);
}
function pieceText(outfit, i){
  const p = outfit.pieces[i];
  const idx = colorState[outfit.id][i];
  return p.colors.length ? p.t.replace("{c}", p.colors[idx]) : p.t;
}
function buildPrompt(outfit){
  return outfit.pieces.map((_,i)=>pieceText(outfit,i)).join(", ");
}

/* ===== 목록/필터/페이지 ===== */
let curSeason = "all", curPage = 1, curQuery = "";
function filtered(){
  const q = curQuery.trim().toLowerCase();
  return OUTFITS.filter(o=>{
    if(curSeason!=="all" && o.season!==curSeason) return false;
    if(!q) return true;
    const hay = (o.id+" "+o.style+" "+SEASON_KO[o.season]+" "+o.pieces.map(p=>p.t+" "+p.k).join(" ")).toLowerCase();
    return hay.includes(q);
  });
}
function render(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length/PER_PAGE));
  if(curPage>pages) curPage = pages;
  const slice = list.slice((curPage-1)*PER_PAGE, curPage*PER_PAGE);

  document.getElementById("countText").textContent =
    `${SEASON_KO[curSeason]} ${list.length}개 코디`;

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  slice.forEach(o=>{
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = o.id;
    card.innerHTML = `
      <div class="meta">
        <span class="badge ${o.season}">${SEASON_KO[o.season]}</span>
        <span class="cid">${o.id}</span>
        <span class="style">${o.style}</span>
      </div>
      <div class="noimg">NO IMAGE</div>
      <div class="preview"></div>
      <div class="btns">
        <button class="b-rand">🎲 랜덤</button>
        <button class="b-det">상세</button>
        <button class="b-copy">복사</button>
      </div>`;
    card.querySelector(".preview").textContent = buildPrompt(o);
    card.querySelector(".b-rand").addEventListener("click", ()=>{
      randomizeColors(o.id);
      card.querySelector(".preview").textContent = buildPrompt(o);
      if(sheetOpenId===o.id) renderSheetBody(o);
    });
    card.querySelector(".b-copy").addEventListener("click", ()=>copyPrompt(o));
    card.querySelector(".b-det").addEventListener("click", ()=>openSheet(o.id));
    grid.appendChild(card);
  });

  document.getElementById("pageText").textContent = `${curPage} / ${pages}`;
  document.getElementById("prevBtn").disabled = curPage<=1;
  document.getElementById("nextBtn").disabled = curPage>=pages;
}
function refreshCard(id){
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if(card){
    const o = OUTFITS.find(x=>x.id===id);
    card.querySelector(".preview").textContent = buildPrompt(o);
  }
}

/* ===== 상세 바텀시트 ===== */
let sheetOpenId = null;
function openSheet(id){
  const o = OUTFITS.find(x=>x.id===id);
  sheetOpenId = id;
  const b = document.getElementById("shBadge");
  b.className = "badge "+o.season;
  b.textContent = SEASON_KO[o.season];
  document.getElementById("shId").textContent = o.id;
  document.getElementById("shStyle").textContent = o.style;
  renderSheetBody(o);
  document.getElementById("sheetBg").classList.add("open");
  document.getElementById("sheet").classList.add("open");
}
function closeSheet(){
  sheetOpenId = null;
  document.getElementById("sheetBg").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}
function renderSheetBody(o){
  const body = document.getElementById("sheetBody");
  body.innerHTML = "";
  o.pieces.forEach((p,i)=>{
    const div = document.createElement("div");
    div.className = "piece";
    const lab = document.createElement("div");
    lab.className = "lab"; lab.textContent = p.k;
    const desc = document.createElement("div");
    desc.className = "desc"; desc.textContent = pieceText(o,i);
    div.appendChild(lab); div.appendChild(desc);
    if(p.colors.length){
      const sel = document.createElement("select");
      p.colors.forEach((c,ci)=>{
        const op = document.createElement("option");
        op.value = ci; op.textContent = c;
        if(ci===colorState[o.id][i]) op.selected = true;
        sel.appendChild(op);
      });
      sel.addEventListener("change", ()=>{
        colorState[o.id][i] = Number(sel.value);
        desc.textContent = pieceText(o,i);
        fp.textContent = buildPrompt(o);
        refreshCard(o.id);
      });
      div.appendChild(sel);
    }
    body.appendChild(div);
  });
  const fp = document.createElement("div");
  fp.className = "fullprompt";
  fp.textContent = buildPrompt(o);
  body.appendChild(fp);
}

/* ===== 복사 (모바일 대응: Clipboard API → execCommand → 수동) ===== */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
}
function legacyCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.left = "-9999px"; ta.style.top = "0";
  ta.setAttribute("readonly","");
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
function showManual(text){
  const ta = document.getElementById("manualText");
  ta.value = text;
  document.getElementById("manualBg").classList.add("open");
  setTimeout(()=>{ ta.focus(); ta.select(); }, 50);
}
async function copyPrompt(outfit){
  const text = buildPrompt(outfit); // 복사 시점의 현재 색상으로 생성
  let done = false;
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); done = true; }catch(e){ done = false; }
  }
  if(!done) done = legacyCopy(text);
  if(done) toast(`${outfit.id} 프롬프트 복사 완료`);
  else showManual(text);
}

/* ===== 이벤트 바인딩 ===== */
function buildSeasonTabs(){
  const wrap = document.getElementById("seasonTabs");
  ["all","spring","summer","autumn","winter"].forEach(s=>{
    const btn = document.createElement("button");
    btn.textContent = SEASON_KO[s];
    btn.dataset.season = s;
    if(s===curSeason) btn.classList.add("on");
    btn.addEventListener("click", ()=>{
      curSeason = s; curPage = 1;
      wrap.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===btn));
      render();
    });
    wrap.appendChild(btn);
  });
}
document.getElementById("searchInput").addEventListener("input", e=>{
  curQuery = e.target.value; curPage = 1; render();
});
document.getElementById("prevBtn").addEventListener("click", ()=>{ curPage--; render(); });
document.getElementById("nextBtn").addEventListener("click", ()=>{ curPage++; render(); });
document.getElementById("shClose").addEventListener("click", closeSheet);
document.getElementById("sheetBg").addEventListener("click", closeSheet);
document.getElementById("shRand").addEventListener("click", ()=>{
  if(!sheetOpenId) return;
  randomizeColors(sheetOpenId);
  renderSheetBody(OUTFITS.find(x=>x.id===sheetOpenId));
  refreshCard(sheetOpenId);
});
document.getElementById("shCopy").addEventListener("click", ()=>{
  if(!sheetOpenId) return;
  copyPrompt(OUTFITS.find(x=>x.id===sheetOpenId));
});
document.getElementById("manualClose").addEventListener("click", ()=>{
  document.getElementById("manualBg").classList.remove("open");
});

/* ===== 초기화: 새로고침 시 기본 색상 랜덤 ===== */
initColors();
buildSeasonTabs();
render();
</script>
